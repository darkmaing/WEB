<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>현황판</title>
    <script>
        function fetchData() {
            let siteId = document.getElementById("siteInput").value;
			
			 if (siteId) {
			localStorage.setItem("siteNumber", siteId); // 입력값 저장
			}
			
            fetch(`http://192.168.208.252:5000/get_shipping_status?site_id=${siteId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("order_no").innerText = data.order_no;
                    document.getElementById("ct_no").innerText = data.ct_no;
                    document.getElementById("spec_no").innerText = data.spec_no;
					document.getElementById("product_name").innerText = data.product_name;
                })
                .catch(error => console.error("오류 발생:", error));
        }
		
		window.onload = function () {
		let savedSiteId = localStorage.getItem("siteNumber");
		if (savedSiteId) {
			document.getElementById("siteInput").value = savedSiteId; // 입력 필드에 저장된 값 자동 설정
			fetchData(); // 저장된 값으로 자동 데이터 요청
			}
		};
		
		function updateGantryStatus(status) {
			let gantry1 = document.getElementById("gantry1");
			let gantry2 = document.getElementById("gantry2");
			let gantry3 = document.getElementById("gantry3");

			// 상태별 이미지 변경
			if (status === "error") {
				gantry1.src = "/static/data/red.png";  // 빨간 버튼 이미지
				gantry2.src = "/static/data/red.png";  // 빨간 버튼 이미지
				gantry3.src = "/static/data/red.png";  // 빨간 버튼 이미지
			} else if (status === "operating") {
				gantry1.src = "/static/data/green.png";  // 초록 버튼 이미지
				gantry2.src = "/static/data/green.png";  // 초록 버튼 이미지
				gantry3.src = "/static/data/green.png";  // 초록 버튼 이미지
			} else {
				gantry1.src = "/static/data/gray.png";  // 회색 버튼 이미지
				gantry2.src = "/static/data/gray.png";  // 회색 버튼 이미지
				gantry3.src = "/static/data/gray.png";  // 회색 버튼 이미지
			}
		}

		// 테스트: 3초마다 상태 변경
		setInterval(() => {
			let states = ["error", "operating", "idle"];
			let randomState = states[Math.floor(Math.random() * states.length)];
			updateGantryStatus(randomState);
		}, 3000);
		
		function updateDateTime() {
			let now = new Date();
			
			// 날짜 가져오기
			let year = now.getFullYear();  // 연도
			let month = (now.getMonth() + 1).toString().padStart(2, '0'); // 월 (0부터 시작하므로 +1)
			let day = now.getDate().toString().padStart(2, '0');  // 일
			
			// 시간 가져오기
			let hours = now.getHours().toString().padStart(2, '0');  // 시
			let minutes = now.getMinutes().toString().padStart(2, '0');  // 분
			let seconds = now.getSeconds().toString().padStart(2, '0');  // 초
			
			// YYYY-MM-DD HH:MM:SS 형식으로 표시
			let formattedDateTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
			
			document.getElementById("currentDateTime").innerText = formattedDateTime;
		}

		// 1초마다 날짜 + 시간 업데이트
		setInterval(updateDateTime, 1000);
		setInterval(fetchData, 3000);

		// 페이지 로드 시 최초 호출
		updateDateTime();
		
		function showErrorMessage(message) {
			document.getElementById("errorMessage").innerText = `⚠ 오류: ${message}`;
		}

		// 예제: 5초 후 에러 발생 메시지 변경
		setTimeout(() => {
			showErrorMessage("서버 연결 끊김!");
		}, 5000);
			
    </script>
