<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Choose Sites - {{ app_type | upper }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .system-label {
            display: inline-block;
            margin-bottom: 20px;
            padding: 6px 20px;
            font-size: 18px;
            font-weight: bold;
            background: #333;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 6px;
        }

        .site-btn {
            width: 120px;
            height: 60px;
            margin: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #555;
            background: #222;
            color: #fff;
            position: relative;
        }

        .site-btn.selected {
            background: #ffd700;
            color: #000;
        }

        .site-btn .pos {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 6px;
            background: #000;
            color: #ffd700;
        }

        .control {
            margin-top: 30px;
        }

        .back-btn {
            font-size: 16px;
            padding: 8px 20px;
            margin: 0 10px;
            cursor: pointer;
            background: #333;
            color: #aaa;
            border: 1px solid #555;
        }

        .swap-btn,
        .submit-btn {
            font-size: 20px;
            padding: 10px 24px;
            margin: 0 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Choose Site (LEFT / RIGHT)</h1>
<div class="system-label">{{ app_type | upper }}</div>

<form method="POST" action="{{ action_url }}">

    <div>
        {% for row in sites %}
            {% for site in row %}
            <button type="button" class="site-btn" data-site="{{ site }}">{{ site }}</button>
            {% endfor %}
            <p></p>
        {% endfor %}
    </div>

    <div id="hiddenInputs"></div>

    <div class="control">
        <button type="button" class="back-btn" onclick="location.href='/'">← Back</button>
        <button type="button" class="swap-btn" id="swapBtn">↔ Change Left/Right</button>
        <button type="submit" class="submit-btn">Submit</button>
    </div>

</form>

<script>
    const siteButtons = document.querySelectorAll(".site-btn");
    const hiddenInputs = document.getElementById("hiddenInputs");
    const swapBtn = document.getElementById("swapBtn");

    let selectedSites = [];

    siteButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            const site = btn.dataset.site;

            if (selectedSites.includes(site)) {
                selectedSites = selectedSites.filter(s => s !== site);
            } else {
                if (selectedSites.length >= 2) {
                    alert("사이트는 최대 2개까지 선택 가능합니다.");
                    return;
                }
                selectedSites.push(site);
            }

            render();
        });
    });

    swapBtn.addEventListener("click", () => {
        if (selectedSites.length === 2) {
            selectedSites.reverse();
            render();
        }
    });

    function render() {
        siteButtons.forEach(btn => {
            btn.classList.remove("selected");
            const badge = btn.querySelector(".pos");
            if (badge) badge.remove();
        });

        selectedSites.forEach((site, idx) => {
            const btn = document.querySelector(`.site-btn[data-site="${site}"]`);
            btn.classList.add("selected");

            const badge = document.createElement("div");
            badge.className = "pos";
            badge.innerText = idx === 0 ? "LEFT" : "RIGHT";
            btn.appendChild(badge);
        });

        hiddenInputs.innerHTML = "";
        selectedSites.forEach(site => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "site";
            input.value = site;
            hiddenInputs.appendChild(input);
        });
    }
</script>

</body>
</html>
